name: topaz
# libtopaz-gl.dylib, libtopaz-inject.dylib and the backboardd wrapper (GPU rendering for the window server).
# The result is the artifact "topaz-ios".
#
# Same registration problem as mesa.yml: a workflow_dispatch-only file that has
# never run in this repo is invisible to the API and the dispatch endpoint 404s.
on:
  workflow_dispatch:
  push:
    branches: [rosy]
    paths:
      - '.github/workflows/topaz.yml'
      - 'userland/gpu/**'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -o pipefail
          bash userland/gpu/mk-topaz-ci.sh 2>&1 | tee topaz-build.log
      - name: Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topaz-log
          path: topaz-build.log
      - name: Result
        uses: actions/upload-artifact@v4
        with:
          name: topaz-ios
          path: build-topaz/out/
