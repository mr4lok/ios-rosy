name: mesa
# Mesa 25.0.7 (freedreno + OSMesa) for the iOS 16 userland and the gputest program, built with Xcode's clang.
# The result is the artifact "mesa-ios".
#
# GitHub only registers a workflow in a repository once it has run there, and a
# `workflow_dispatch`-only file that has never run is invisible to both the API and
# the dispatch endpoint (404).  So this also triggers on pushes that touch the Mesa
# sources, which registers it; keep the paths filter narrow.
on:
  workflow_dispatch:
  push:
    branches: [rosy]
    paths:
      - '.github/workflows/mesa.yml'
      - 'userland/mesa/**'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          brew install meson ninja bison flex pkg-config
          xcrun --sdk iphoneos --show-sdk-path
      - name: Build
        run: bash userland/mesa/mk-mesa-ci.sh
      - name: Logs of a failed build
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mesa-logs
          path: |
            build-mesa/meson-setup.log
            build-mesa/ninja.log
            build-mesa/build-*/meson-logs/meson-log.txt
      - name: Result
        uses: actions/upload-artifact@v4
        with:
          name: mesa-ios
          path: build-mesa/out/
